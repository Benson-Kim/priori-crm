# Render deployment configuration for Priori CRM
# https://render.com/docs/blueprint-spec

services:
  # PostgreSQL Database
  - type: pserv
    name: priori-crm-db
    env: docker
    plan: starter
    region: frankfurt
    databases:
      - name: priori_crm
        databaseName: priori_crm
        user: priori

  # Redis for rate limiting and token denylist
  - type: redis
    name: priori-crm-redis
    plan: starter
    region: frankfurt
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # API Service
  - type: web
    name: priori-crm-api
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    # Health route is mounted under the API prefix (see app/main.py:
    # include_router(health_router, prefix=API_V1_PREFIX)), so the probe path
    # must be the fully-qualified /api/v1/health — a bare /health 404s.
    healthCheckPath: /api/v1/health
    envVars:
      # Application
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: APP_NAME
        value: Priori CRM

      # Database - auto-populated by Render
      - key: DATABASE_URL
        fromDatabase:
          name: priori-crm-db
          property: connectionString

      # Redis - auto-populated by Render
      - key: REDIS_URL
        fromService:
          type: redis
          name: priori-crm-redis
          property: connectionString

      # JWT - generate a secure key and add to Render dashboard
      - key: JWT_SECRET_KEY
        sync: false  # Must be set manually in Render dashboard

      # AWS SES - add these to Render dashboard
      - key: AWS_REGION
        value: af-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false  # Must be set manually in Render dashboard
      - key: AWS_SECRET_ACCESS_KEY
        sync: false  # Must be set manually in Render dashboard
      - key: SES_SENDER_EMAIL
        sync: false  # Must be set manually in Render dashboard (e.g., noreply@yourdomain.com)

      # Rate Limiting - use Redis in production
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: TOKEN_DENYLIST_BACKEND
        value: redis
      - key: RATE_LIMIT_PER_MINUTE
        value: 60

      # CORS - update with your frontend domain
      - key: CORS_ORIGINS
        value: https://your-frontend-domain.vercel.app,http://localhost:5173

      # Storage - using local for now, can switch to S3
      - key: STORAGE_BACKEND
        value: local
      - key: UPLOAD_DIR
        value: /var/data/uploads

      # Internal job authentication: gates the scheduler-only endpoints
      # (email-outbox drain, nightly transitions, OTP purge). The endpoints
      # fail CLOSED when this is unset, so it must be provisioned. Generate
      # with: python -c "import secrets; print(secrets.token_urlsafe(32))"
      # and set the SAME value on the priori-crm-scheduler cron service.
      - key: INTERNAL_API_SECRET
        sync: false  # Must be set manually (shared with the scheduler)

      # Export batch cap (truncation detection uses BATCH_SIZE + 1).
      - key: BATCH_SIZE
        value: 1000

      # Monitoring (optional)
      - key: SENTRY_DSN
        sync: false
      - key: LOG_LEVEL
        value: INFO

    # Persistent disk for file uploads (if using local storage)
    disk:
      name: uploads
      mountPath: /var/data/uploads
      sizeGB: 10

  # Scheduler: periodically drives the internal job endpoints (the API has
  # no in-process scheduler, by design — see app/common/email_outbox.py).
  # Each call carries the shared X-Internal-Secret. The drain cadence bounds
  # how long a first-attempt SES failure stays queued before redelivery;
  # rows dead-letter after MAX_DELIVERY_ATTEMPTS (5).
  - type: cron
    name: priori-crm-scheduler-outbox-drain
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    schedule: "*/5 * * * *"  # every 5 minutes
    dockerCommand: >-
      sh -c 'curl -fsS -X POST
      -H "X-Internal-Secret: $INTERNAL_API_SECRET"
      "$API_BASE_URL/api/v1/internal/email-outbox/drain"'
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: priori-crm-api
          property: host
      - key: INTERNAL_API_SECRET
        sync: false  # Must match priori-crm-api's INTERNAL_API_SECRET

  - type: cron
    name: priori-crm-scheduler-nightly
    env: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    schedule: "15 0 * * *"  # 00:15 UTC daily
    dockerCommand: >-
      sh -c 'set -e;
      H="-H \"X-Internal-Secret: $INTERNAL_API_SECRET\"";
      curl -fsS -X POST $H "$API_BASE_URL/api/v1/invoices/internal/transition-overdue";
      curl -fsS -X POST $H "$API_BASE_URL/api/v1/quotes/internal/transition-expired";
      curl -fsS -X POST $H "$API_BASE_URL/api/v1/expenses/internal/transition-overdue";
      curl -fsS -X POST $H "$API_BASE_URL/api/v1/auth/internal/purge-otps"'
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: priori-crm-api
          property: host
      - key: INTERNAL_API_SECRET
        sync: false  # Must match priori-crm-api's INTERNAL_API_SECRET

# IMPORTANT: After deploying, you MUST set these environment variables in the Render dashboard:
# 1. JWT_SECRET_KEY - Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
# 2. AWS_ACCESS_KEY_ID - Your AWS IAM access key with SES permissions
# 3. AWS_SECRET_ACCESS_KEY - Your AWS IAM secret key
# 4. SES_SENDER_EMAIL - Verified email address in AWS SES (e.g., noreply@yourdomain.com)
# 5. INTERNAL_API_SECRET - the SAME value on priori-crm-api AND both scheduler
#    cron services (gates the internal job endpoints; they fail closed if unset)
# 6. Update CORS_ORIGINS with your actual frontend domain
#
# OPERATIONAL (outside this repo — see PO-15 #16):
# - SES: verify sender identity/domain, request production (out-of-sandbox)
#   access, confirm AWS_REGION.
# - Object storage: provision the S3 bucket + least-privilege IAM and a
#   retention/lifecycle policy when STORAGE_BACKEND=s3.
# - Alerting: alert if a cron job has not succeeded within its window, and
#   on email_outbox rows reaching the `dead` status (delivery exhausted).