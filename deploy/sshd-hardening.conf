# sshd hardening drop-in — installed by deploy/host_hardening.sh as
# /etc/ssh/sshd_config.d/00-priori-hardening.conf (issue #86).
#
# WHY THE 00- PREFIX MATTERS: Ubuntu's /etc/ssh/sshd_config has
# `Include /etc/ssh/sshd_config.d/*.conf` at the TOP of the file, the glob
# is expanded in lexical order, and sshd keeps the FIRST value it sees for
# every keyword — so the lexicographically-earliest drop-in wins. Cloud
# provisioning writes 50-cloud-init.conf (which sets
# `PasswordAuthentication yes` on password-provisioned droplets) and cloud
# images ship 60-cloudimg-settings.conf; 00- sorts before both, making this
# file authoritative. A 99- prefix would be silently overridden.
#
# Verify the effective configuration after any change:
#   sshd -T | grep -Ei 'passwordauth|permitroot|kbdinteractive|emptypass'

# All authentication is public-key. Password and keyboard-interactive auth
# are attack surface with zero legitimate users: every documented access
# path (operator ssh, the CI deploy key, the DO-injected root key) is
# key-based. This is also the load-bearing premise of the documented
# fail2ban rejection (docs/operations/host-hardening.md) — do not re-enable
# passwords without revisiting that decision.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Root stays key-only, not "no": root-with-key is the documented DigitalOcean
# access path (droplet provisioning injects the root key; the droplet rebuild
# bootstrap runs as root). "prohibit-password" forbids exactly what the
# threat model cares about — root login with a password.
PermitRootLogin prohibit-password

# Headless API droplet: no X11.
X11Forwarding no
