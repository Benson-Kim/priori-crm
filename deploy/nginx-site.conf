# nginx site for accounting.priori.co.ke — committed, canonical copy.
#
# Installed by deploy/droplet_rebuild.sh as
# /etc/nginx/sites-available/priori-crm.conf (symlinked into sites-enabled/;
# the distro default site is removed). This file is the config-as-code source
# the illustrative snippet in docs/operations/deployment-setup.md §2.4 used to
# be. Contains no secrets.
#
# TLS is deliberately NOT configured here: certificate issuance is a
# documented hand-finish step (certbot --nginx -d accounting.priori.co.ke,
# after DNS points at the droplet). certbot's nginx installer rewrites this
# server block in place to add the 443 listener and the HTTP->HTTPS redirect —
# committing a 443 block that references not-yet-existing certificate files
# would make `nginx -t` fail on a fresh droplet and block the whole rebuild.
#
# proxy_pass has NO trailing slash / URI part: the URI is passed through
# unmodified, so the app (API_V1_PREFIX=/api/v1 in production) sees
# /api/v1/... exactly as the client sent it. The bind address/port must stay
# in lockstep with deploy/priori-api.service (127.0.0.1:8000).

server {
    listen 80;
    listen [::]:80;
    server_name accounting.priori.co.ke;

    # SPA — built in CI, rsync'd as static files; swapped atomically with the
    # API by the /srv/priori/current symlink (deploy/production_release.sh).
    root /srv/priori/current/frontend/dist;
    index index.html;

    # Proof-of-payment uploads go through the API; give them headroom above
    # nginx's 1m default without allowing arbitrarily large bodies.
    client_max_body_size 25m;

    location /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACME HTTP-01 webroot, so certificate issuance/renewal never depends on
    # the SPA fallback below swallowing /.well-known requests.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri /index.html;   # SPA deep links
    }
}
