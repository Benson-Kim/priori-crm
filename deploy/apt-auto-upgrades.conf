// APT periodic switches — installed by deploy/host_hardening.sh as
// /etc/apt/apt.conf.d/20auto-upgrades (issue #86). Overwrites the
// debconf-generated file deliberately: the committed copy is canonical
// (config-as-code), and this file never holds hand-local state.
//
// These two switches make the apt-daily systemd timers actually refresh
// package lists and run unattended-upgrade; WHAT gets upgraded is scoped
// in 52priori-unattended-upgrades (security pocket only).
APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
