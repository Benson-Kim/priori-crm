// unattended-upgrades policy — installed by deploy/host_hardening.sh as
// /etc/apt/apt.conf.d/52priori-unattended-upgrades (issue #86).
//
// Numbered 52 so it is parsed AFTER the package's own 50unattended-upgrades:
// scalar options below override that file's values. Allowed-Origins /
// Origins-Pattern are LISTS, which apt merges across files instead of
// replacing — the #clear directives make this file authoritative for the
// upgrade scope regardless of what the distro default ships or a hand edit
// added.
#clear Unattended-Upgrade::Allowed-Origins;
#clear Unattended-Upgrade::Origins-Pattern;

// Security pocket only. Non-security updates arrive through deliberate,
// announced `apt upgrade` maintenance — an unattended jump of nginx or
// PostgreSQL under the ledger is not acceptable; an unpatched CVE is worse.
// The ESM lines match only when Ubuntu Pro is attached and are inert
// otherwise (and on non-Ubuntu hosts).
Unattended-Upgrade::Allowed-Origins {
    "${distro_id}:${distro_codename}-security";
    "${distro_id}ESMApps:${distro_codename}-apps-security";
    "${distro_id}ESM:${distro_codename}-infra-security";
};

// Never reboot the ledger's database host unattended. Kernel/libc updates
// that need a reboot set /var/run/reboot-required; the host-hardening audit
// checklist (docs/operations/host-hardening.md) checks it, and the reboot
// happens in an announced window like any other restart.
Unattended-Upgrade::Automatic-Reboot "false";

// Keep the disk from filling with superseded kernels.
Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
Unattended-Upgrade::Remove-New-Unused-Dependencies "true";
