# Duo Agent Platform flow-execution config.
# NOTE: this file is read ONLY from the default branch (main); copies on
# other branches are ignored. See
# https://docs.gitlab.com/user/duo_agent_platform/flows/execution/agent-config-yaml/
#
# Why this exists: agent sessions in this project repeatedly hit two walls
# during verification passes (MR !69 hardening, MR !68 authz review):
#   - shellcheck could not be provisioned (binary download 403), so the
#     shell-quality pass over deploy/*.sh and workflow run: blocks was
#     skipped and had to fall back to `bash -n` only;
#   - PyPI egress was blocked, so python-dotenv/pytest/ruff could not be
#     installed and verification had to lean entirely on the MR CI pipeline.

setup_script:
  # apt first (default image runs as root); pip fallback if the image is
  # not Debian-based; never hard-fail the flow over tooling.
  - apt-get update -qq || true
  - 'apt-get install -y -qq shellcheck || pip install --quiet shellcheck-py || echo "WARNING - shellcheck could not be installed"'
  - shellcheck --version || true
  # gh CLI, so sessions can watch GitHub Actions runs on the deploy
  # mirror (benson-priori/priori-crm). Auth: flow jobs do NOT receive
  # custom CI/CD variables (see execution-variables docs), so sessions
  # read credentials at runtime from the private project snippet named
  # 'duo-agent-credentials' (dotenv format: GH_TOKEN=..., optionally
  # GITLAB_MERGE_TOKEN=...) using the composite identity's read_api
  # scope, e.g.:
  #   glab api "projects/$CI_PROJECT_ID/snippets" | <find id by title>
  #   glab api "projects/$CI_PROJECT_ID/snippets/<id>/raw"
  # then: export GH_TOKEN=... ; gh auth status confirms.
  - 'apt-get install -y -qq gh || echo "WARNING - gh CLI could not be installed"'
  - gh --version || true
  # Local PostgreSQL for api/ pytest runs (issue #60 acceptance; issue #88:
  # the documented SQLite fallback no longer builds the schema - 802
  # collection-time errors - so real verification needs Postgres).
  # Best-effort, never hard-fails the flow. The suite's fail-closed guard
  # (api/tests/conftest.py::_require_test_database) requires a database
  # name containing 'test'; CI uses prioritech_test. Sessions export:
  #   DATABASE_URL=postgresql://priori:priori@localhost:5432/prioritech_test
  - 'apt-get install -y -qq postgresql || echo "WARNING - postgresql could not be installed"'
  - 'service postgresql start || true'
  - |
    su postgres -c "psql -c \"CREATE ROLE priori LOGIN SUPERUSER PASSWORD 'priori'\"" || true
  - 'su postgres -c "createdb -O priori prioritech_test" || true'
  - 'su postgres -c "psql -c \"SELECT version()\"" || true'

network_policy:
  include_recommended_allowed: true
  allowed_domains:
    # apt mirrors (Debian and Ubuntu bases)
    - deb.debian.org
    - security.debian.org
    - archive.ubuntu.com
    - security.ubuntu.com
    - ports.ubuntu.com
    # Python package index, so sessions can install python-dotenv, pytest,
    # ruff, shellcheck-py etc. for local verification
    - pypi.org
    - files.pythonhosted.org
    # npm registry, so sessions can run `npm ci` / `npm run lint` /
    # `npm run build` in frontend/ (issue #60: QA hand-off sessions
    # 6359439/6359441 were cancelled mid-verification because npm ci hung
    # against the blocked registry). Every frontend dependency - including
    # the vite/esbuild/rollup/tailwind-oxide native binaries - ships as an
    # npm tarball from this single host; `npx openapi-typescript`
    # (gen:api/prebuild) resolves from here too. No other npm-adjacent
    # domain is needed by this dependency set.
    - registry.npmjs.org
    # GitHub, so sessions can watch Actions runs on the deploy mirror
    # benson-priori/priori-crm (REST API + gh CLI + log downloads)
    - github.com
    - api.github.com
    - uploads.github.com
    - objects.githubusercontent.com
    - results-receiver.actions.githubusercontent.com
    # Staging host, so sessions can verify the public health endpoint
    # (HTTPS only - the sandbox proxy does not carry SSH; host-side
    # triage runs inside the GitHub workflow via deploy/staging_diagnose.sh)
    - staging.crm.priori.co.ke
