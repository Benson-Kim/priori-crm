# Scheduled internal-job caller
#
# These jobs run ONLY on GitLab *scheduled* pipelines
# (CI_PIPELINE_SOURCE == "schedule"). They never run on merge-request or
# branch pipelines, so they cannot interfere with the lint/test/contract
# stages in .gitlab-ci.yml.
#
# Each job is a thin, dependency-free `curl` caller for one of the API's
# machine-to-machine endpoints (all gated by the X-Internal-Secret header
# via app.common.dependencies.verify_internal_secret):
#
#   - POST /api/v1/internal/email-outbox/drain          (frequent: ~every 5 min)
#   - POST /api/v1/invoices/internal/transition-overdue (nightly)
#   - POST /api/v1/quotes/internal/transition-expired   (nightly)
#   - POST /api/v1/expenses/internal/transition-overdue (nightly)
#   - POST /api/v1/auth/internal/purge-otps             (nightly)
#
# Set up one GitLab pipeline schedule per task
# (CI/CD > Schedules), each with a SCHEDULED_TASK variable selecting the job:
#
#   SCHEDULED_TASK=drain                 cron: */5 * * * *
#   SCHEDULED_TASK=nightly-transitions   cron: 0 2 * * *   (drives all 3 nightly jobs)
#
# Required CI/CD variables (Settings > CI/CD > Variables; masked, not in repo):
#   - API_BASE_URL        e.g. https://priori-crm-api.onrender.com
#   - INTERNAL_API_SECRET must equal the API's INTERNAL_API_SECRET env var
#
# Alerting: any non-2xx response fails the job. Configure pipeline-failure
# notifications / an integration on these scheduled pipelines so a missed or
# failing run pages on-call (AC: alert if a job has not run in its window).

.scheduled-base:
  stage: scheduled
  image: curlimages/curl:8.11.1
  # Only on scheduled pipelines. The per-job `SCHEDULED_TASK` match keeps each
  # schedule running exactly one task.
  rules:
    - if: '$CI_PIPELINE_SOURCE != "schedule"'
      when: never
  variables:
    # Fail the whole job if any curl in the script returns non-zero.
    GIT_STRATEGY: none
  before_script:
    - |
      if [ -z "$API_BASE_URL" ] || [ -z "$INTERNAL_API_SECRET" ]; then
        echo "API_BASE_URL and INTERNAL_API_SECRET must be set as CI/CD variables." >&2
        exit 1
      fi

# Reusable POST helper: calls an internal endpoint, prints the body, and fails
# the job on any non-2xx status so the scheduled pipeline goes red (alerting).
# Usage in script:  call_internal "<path>"
.call-internal: &call-internal
  - |
    call_internal() {
      path="$1"
      url="${API_BASE_URL%/}${path}"
      echo "POST ${url}"
      body=$(mktemp)
      code=$(curl -sS -o "$body" -w "%{http_code}" -X POST "$url" \
        -H "X-Internal-Secret: ${INTERNAL_API_SECRET}" \
        -H "Content-Type: application/json" \
        --max-time 120 --retry 2 --retry-connrefused)
      echo "HTTP ${code}"
      cat "$body"; echo
      if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
        echo "Internal call to ${path} failed with HTTP ${code}" >&2
        return 1
      fi
      # Surface dead-lettered outbox rows as a job failure (delivery exhausted).
      if grep -q '"dead"[[:space:]]*:[[:space:]]*[1-9]' "$body"; then
        echo "Outbox reported dead-lettered rows — investigate delivery." >&2
        return 1
      fi
      return 0
    }

# Frequent: drain the transactional email outbox (retry pending/failed,
# dead-letter after MAX_DELIVERY_ATTEMPTS). Schedule ~every 5 minutes.
scheduled:email-outbox-drain:
  extends: .scheduled-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_TASK == "drain"'
  script:
    - *call-internal
    - call_internal "/api/v1/internal/email-outbox/drain?limit=100"

# Nightly maintenance: overdue invoices, expired quotes, OTP purge, plus a
# final outbox drain. A failure in any step fails the job (alerting).
scheduled:nightly-transitions:
  extends: .scheduled-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_TASK == "nightly-transitions"'
  script:
    - *call-internal
    - call_internal "/api/v1/invoices/internal/transition-overdue"
    - call_internal "/api/v1/quotes/internal/transition-expired"
    - call_internal "/api/v1/expenses/internal/transition-overdue"
    - call_internal "/api/v1/auth/internal/purge-otps"
    - call_internal "/api/v1/internal/email-outbox/drain?limit=200"

# Synthetic monitoring: exercise the critical path every 5 minutes so we know
# the system is breaking before customers do (see docs/operations/slos.md).
# Create a schedule with SCHEDULED_TASK=synthetic and cron */5 * * * *.
# Fails (and thereby alerts) on any non-2xx status, an unexpected body, or a
# response slower than the latency budget. FRONTEND_BASE_URL is optional; when
# set, the frontend root is probed too.
scheduled:synthetic-critical-path:
  extends: .scheduled-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_TASK == "synthetic"'
  variables:
    # Per-request latency budget (seconds) before the probe fails.
    SYNTHETIC_MAX_SECONDS: "5"
  script:
    - |
      probe() {
        url="$1"; expect="$2"
        echo "GET ${url}"
        body=$(mktemp)
        out=$(curl -sS -o "$body" -w "%{http_code} %{time_total}" \
          --max-time "${SYNTHETIC_MAX_SECONDS}" "$url") || {
          echo "Probe failed (timeout / connection) for ${url}" >&2
          return 1
        }
        code=${out% *}; secs=${out#* }
        echo "HTTP ${code} in ${secs}s"
        cat "$body"; echo
        if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
          echo "Probe ${url} returned HTTP ${code}" >&2
          return 1
        fi
        if [ -n "$expect" ] && ! grep -q "$expect" "$body"; then
          echo "Probe ${url} body missing expected marker '${expect}'" >&2
          return 1
        fi
        return 0
      }
      probe "${API_BASE_URL%/}/api/v1/health" '"status":"healthy"'
      probe "${API_BASE_URL%/}/api/v1/ping" '"ping":"pong"'
      if [ -n "$FRONTEND_BASE_URL" ]; then
        probe "${FRONTEND_BASE_URL%/}/" ""
      fi

# Monthly backup restore test: fetch the newest nightly dump from the offsite
# bucket (read-only credentials), restore it into a throwaway Postgres service
# container, and verify it — migration stamp present, key tables non-empty,
# newest audit_events row inside the RPO window (see deploy/db_restore_verify.sh
# and docs/runbooks/database-backup-restore.md). A red run is the alert, same
# convention as the synthetic monitoring. Production credentials are never
# involved: the job sees only a read-only bucket key and a scratch database
# that exists solely for this pipeline.
#
# Schedule (CI/CD > Schedules): SCHEDULED_TASK=restore-verify  cron: 0 3 1 * *
#
# Required CI/CD variables (masked, not in repo):
#   - BACKUP_S3_ENDPOINT           e.g. https://fra1.digitaloceanspaces.com
#   - BACKUP_S3_BUCKET             e.g. priori-crm-backups
#   - BACKUP_S3_ACCESS_KEY_ID      READ-ONLY key scoped to the backup bucket
#   - BACKUP_S3_SECRET_ACCESS_KEY  its secret
scheduled:db-restore-verify:
  extends: .scheduled-base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULED_TASK == "restore-verify"'
  image: postgres:16-alpine   # pg_restore + psql; rclone added in before_script
  services:
    - name: postgres:16-alpine
      alias: scratch-postgres
  variables:
    # The base job never checks out the repo; this one needs
    # deploy/db_restore_verify.sh from the tree.
    GIT_STRATEGY: fetch
    # Scratch service credentials — disposable and pipeline-local, not secrets.
    POSTGRES_DB: restore_verify
    POSTGRES_USER: verify
    POSTGRES_PASSWORD: scratch-only
    # Password deliberately NOT in the URL (argv is visible in ps) — psql
    # reads PGPASSWORD from the environment instead.
    SCRATCH_DB_URL: postgresql://verify@scratch-postgres:5432/restore_verify
    PGPASSWORD: scratch-only
    RPO_HOURS: "26"
  before_script:
    - test -n "${BACKUP_S3_ENDPOINT:-}" || { echo "BACKUP_S3_ENDPOINT must be set as a CI/CD variable." >&2; exit 1; }
    - test -n "${BACKUP_S3_BUCKET:-}" || { echo "BACKUP_S3_BUCKET must be set as a CI/CD variable." >&2; exit 1; }
    - test -n "${BACKUP_S3_ACCESS_KEY_ID:-}" || { echo "BACKUP_S3_ACCESS_KEY_ID must be set as a CI/CD variable." >&2; exit 1; }
    - test -n "${BACKUP_S3_SECRET_ACCESS_KEY:-}" || { echo "BACKUP_S3_SECRET_ACCESS_KEY must be set as a CI/CD variable." >&2; exit 1; }
    - apk add --no-cache rclone
  script:
    # rclone is configured via environment only — no config file on disk and
    # no credentials on argv.
    - export RCLONE_CONFIG_BK_TYPE=s3
    - export RCLONE_CONFIG_BK_PROVIDER=Other
    - export RCLONE_CONFIG_BK_ENDPOINT="$BACKUP_S3_ENDPOINT"
    - export RCLONE_CONFIG_BK_ACCESS_KEY_ID="$BACKUP_S3_ACCESS_KEY_ID"
    - export RCLONE_CONFIG_BK_SECRET_ACCESS_KEY="$BACKUP_S3_SECRET_ACCESS_KEY"
    # Dump names embed a fixed-width UTC timestamp, so lexical sort order is
    # chronological order and `sort | tail -1` is the newest dump.
    - LATEST="$(rclone lsf --files-only "bk:${BACKUP_S3_BUCKET}/db/" | sort | tail -n 1)"
    - test -n "$LATEST" || { echo "No dumps found in ${BACKUP_S3_BUCKET}/db/ — is the nightly backup running?" >&2; exit 1; }
    - echo "Newest offsite dump: $LATEST"
    - rclone copyto "bk:${BACKUP_S3_BUCKET}/db/${LATEST}" ./latest.dump
    - bash deploy/db_restore_verify.sh ./latest.dump
