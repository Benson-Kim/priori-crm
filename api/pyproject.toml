[project]
name = "prioritech-api"
version = "1.0.0"
description = "Business Central Accounting Software API"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
# Correctness-focused, low-churn baseline that the existing code satisfies,
# so `ruff check` is an enforceable CI gate from the first green pipeline.
# ANN (annotation coverage) stays deferred (covered by mypy). S (bandit) is
# now enabled as a lightweight SAST gate (WI-04): app code is clean bar a
# handful of documented false positives suppressed inline with `# noqa: S…`,
# and tests exempt the assert/secret rules below.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (SAST: hardcoded secrets, weak crypto, SQL, etc.)
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
    # Depends()/Query()/File() in argument defaults is the idiomatic FastAPI
    # pattern, not a bug — exempt it from flake8-bugbear.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/versions/*.py" = ["ALL"]
# Tests legitimately use `assert` (S101) and embed throwaway fixture
# credentials/tokens (S105/S106); these are not production secrets.
"tests/*.py" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = """
    --strict-markers
    --tb=short
    --disable-warnings
    -v
"""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]