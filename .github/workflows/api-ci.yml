name: API CI

on:
  push:
    branches: [main, develop]
    paths: ["api/**"]
  pull_request:
    branches: [main, develop]
    paths: ["api/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: prioritech_test
          POSTGRES_USER: priori
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U priori -d prioritech_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests
        run: pytest -v --tb=short
        env:
          DATABASE_URL: postgresql://priori:test_password@localhost:5432/prioritech_test
          DATABASE_URL: postgresql+psycopg2://priori:test_password@localhost:5432/prioritech_test
          JWT_SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
          SES_SENDER_EMAIL: noreply@ci.example.com
          ENVIRONMENT: test
