<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary metadata -->
    <title>Business Central</title>
    <meta
      name="description"
      content="Business Central accounting and CRM platform: manage customers, vendors, quotes, invoices, purchase orders, expenses and payments in one place."
    />
    <meta name="application-name" content="Business Central" />
    <meta name="author" content="Business Central" />
    <meta name="generator" content="React + Vite" />

    <!-- Internal business app: keep it out of search indexes. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Theme / installable behaviour -->
    <meta name="theme-color" content="#3a1078" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Business Central" />

    <!-- Don't let mobile browsers auto-link phone numbers / amounts. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <!-- Open Graph (internal link unfurls) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Business Central" />
    <meta property="og:title" content="Business Central" />
    <meta
      property="og:description"
      content="Manage customers, vendors, quotes, invoices, purchase orders, expenses and payments in one place."
    />
    <meta property="og:image" content="/logo.svg" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Business Central" />
    <meta
      name="twitter:description"
      content="Manage customers, vendors, quotes, invoices, purchase orders, expenses and payments in one place."
    />
    <meta name="twitter:image" content="/logo.svg" />

    <!-- Icons + manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Performance: pre-load the app entry module for a faster first paint.
         (The API origin is warmed at runtime in appConfig, which reads
         VITE_API_BASE_URL; a build-time placeholder here would ship a broken
         href when the var is unset.) -->
    <link rel="modulepreload" href="/src/main.tsx" />
  </head>
  <body>
    <div id="root">
      <!-- First-frame placeholder shown until React mounts; replaced on render.
           Uses the app background so startup never flashes stark white. -->
      <div style="position:fixed;inset:0;background:#f3f4f6"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
