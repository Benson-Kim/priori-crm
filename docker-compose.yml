services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prioritech
      POSTGRES_USER: priori
      POSTGRES_PASSWORD: ${DB_PASSWORD:-priori_dev_123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U priori -d prioritech"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prioritech_network

  api:
    build: ./api
    container_name: api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Secrets and full config come from ./api/.env. The values below document
    # the env vars the PO module relies on and give safe local defaults;
    # anything sensitive (AWS keys, INTERNAL_API_SECRET) must come from .env
    # or the shell and is intentionally left unset here.
    env_file: ./api/.env
    environment:
      # Email delivery (PO Send / transactional outbox) — credentials via .env.
      AWS_REGION: ${AWS_REGION:-af-south-1}
      SES_SENDER_EMAIL: ${SES_SENDER_EMAIL:-noreply@example.com}
      # Object storage for PO document attachments. Local backend by default;
      # set STORAGE_BACKEND=s3 + S3_BUCKET/S3_REGION for the S3 backend.
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      # Shared secret gating the internal scheduler endpoints (outbox drain,
      # nightly transitions, OTP purge). Must match the scheduler's value.
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      # Export truncation cap (Excel/PDF).
      BATCH_SIZE: ${BATCH_SIZE:-1000}
    volumes:
      - ./api:/app
    networks:
      - prioritech_network
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: prioritech_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prioritech_network

  ui:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
  redis_data:

networks:
  prioritech_network:
    driver: bridge
