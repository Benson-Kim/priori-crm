# GitLab CI pipeline
#
# Runs on every merge request targeting develop/main and on pushes to
# those branches. The repository historically used GitHub Actions
# (.github/workflows/api-ci.yml, ui-ci.yml) which never fired on GitLab
# MR events, so the Postgres-guarded test suite was not executed before
# merge. This pipeline reproduces those jobs natively in GitLab CI.
#
# The security stage runs GitLab's managed SAST, Dependency Scanning, and
# Secret Detection analyzers. Their results satisfy the scan_finding
# approval rules defined in .gitlab/security-policies/policy.yml.
# 
# schedule-only callers for the internal machine-to-machine jobs
# (outbox drain, nightly transitions, OTP purge). Gated to scheduled
# pipelines so they never run on MR/branch pipelines.


include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - local: .gitlab/ci/scheduled-jobs.yml

stages:
  - lint
  - contract
  - test
  - security
  - scheduled

variables:
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp"
  # Analyzers run on branch pipelines only by default; enable them on
  # merge_request_event pipelines so they gate MRs targeting develop.
  AST_ENABLE_MR_PIPELINES: "true"

# Run pipelines for merge requests and for pushes to the long-lived
# branches. The `workflow` block prevents duplicate detached/branch
# pipelines for the same MR commit.
# 
# Allow GitLab CI/CD scheduled pipelines, which run the
# internal-job callers in .gitlab/ci/scheduled-jobs.yml.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# Security scanning
#
# GitLab-managed analyzers. Their own `rules` run them on branch pipelines
# and merge_request pipelines, which the `workflow` block above permits.
# SAST and Secret Detection need no extra config; Dependency Scanning picks
# up api/requirements.txt and frontend/package-lock.json. The injected jobs
# are placed in the `security` stage below.

# Place the injected analyzer jobs in the `security` stage and make them run
# unconditionally on MR pipelines and on develop/main pushes. SAST fans out
# per-language jobs that all extend the `sast` job, and the secret/dependency
# analyzers extend hidden base jobs, so overriding those parents moves and
# re-rules every child job without naming each one.
#
# Explicit rules (rather than the templates' default `changes:`/language
# gating) guarantee the analyzers execute on every MR targeting develop —
# the point of — and avoid an all-skipped, fail-at-creation pipeline
# when an MR only touches .gitlab-ci.yml.
.security-rules: &security-rules
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'

.sast:
  stage: security
  rules: *security-rules

.secret-analyzer:
  stage: security
  rules: *security-rules

.ds-analyzer:
  stage: security
  rules: *security-rules

# Backend (api/)

api:lint:
  stage: lint
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - api/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - api/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files:
        - api/requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - cd api
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - ruff check .
    - ruff format --check .

api:test:
  stage: test
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - api/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - api/**/*
        - .gitlab-ci.yml
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: prioritech_test
    POSTGRES_USER: priori
    POSTGRES_PASSWORD: test_password
    POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    # Postgres-backed test config. conftest.py reads DATABASE_URL
    # and only runs the Postgres-guarded tests when it starts with
    # "postgresql"; using psycopg2 also satisfies config.py's DSN validator.
    DATABASE_URL: "postgresql+psycopg2://priori:test_password@postgres:5432/prioritech_test"
    JWT_SECRET_KEY: "ci-test-secret-key-at-least-32-characters-long" # gitleaks:allow
    SES_SENDER_EMAIL: "noreply@ci.example.com"
    ENVIRONMENT: "test"
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files:
        - api/requirements.txt
    paths:
      - .cache/pip
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends postgresql-client
    - cd api
    - pip install --upgrade pip
    - pip install -r requirements.txt
    # The test conftest builds the schema with Base.metadata.create_all
    # rather than running migrations, so the Postgres extensions the schema
    # depends on (pg_trgm for the W3.1 trigram indexes, pgcrypto for
    # gen_random_uuid() server defaults) must be enabled here first.
    - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 1; done
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS pgcrypto;'
  script:
    # Prove the Alembic chain applies cleanly from an empty database on a
    # copy of the current head (issue #43 acceptance criterion: migration +
    # backfill), and that the newest migration downgrades and re-upgrades.
    # The test suite itself builds its schema via create_all, so this is the
    # only place the actual DDL chain is executed.
    - PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c 'CREATE DATABASE migration_check;'
    - export MIGRATION_DATABASE_URL="postgresql+psycopg2://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/migration_check"
    - DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head
    - DATABASE_URL="$MIGRATION_DATABASE_URL" alembic downgrade -1
    - DATABASE_URL="$MIGRATION_DATABASE_URL" alembic upgrade head
    - pytest -v --tb=short --junitxml=junit.xml
  # JUnit report so failures are inspectable via the pipeline test-report
  # API/UI even when the raw job log is unavailable.
  artifacts:
    when: always
    reports:
      junit: api/junit.xml
    expire_in: 1 week

# Contract types
#
# The frontend previously hand-mirrored the FastAPI Pydantic schemas, which
# drifted from the API and caused real runtime breakage (duplicate-response
# nav, vendor.phone, etc.). This job regenerates the TypeScript contract from
# the live OpenAPI schema so the frontend's `tsc` checks the generated types,
# not hand-written guesses.
#
# The schema is exported *offline* (scripts/export_openapi.py serialises
# app.openapi() with no server and no DB), then published as an artifact the
# ui:lint-build job consumes to generate src/lib/api-schema.d.ts before tsc.

api:openapi-schema:
  stage: contract
  image: python:3.12-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - api/**/*
        - frontend/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
  cache:
    key:
      files:
        - api/requirements.txt
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    # app.main imports config, which validates these even though no server or
    # database is started; app.openapi() itself makes no DB connection.
    DATABASE_URL: "postgresql+psycopg2://placeholder:placeholder@localhost:5432/placeholder"
    JWT_SECRET_KEY: "ci-openapi-export-secret-key-at-least-32-chars" # gitleaks:allow
    SES_SENDER_EMAIL: "noreply@ci.example.com"
    ENVIRONMENT: "test"
  before_script:
    - cd api
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m scripts.export_openapi "$CI_PROJECT_DIR/frontend/openapi.json"
    # TEMP(#57): also emit the exported schema into the job trace (base64 +
    # sha256) so the sandboxed agent, whose token cannot download artifacts,
    # can commit the job's own output verbatim. Reverted in the same MR.
    - sha256sum "$CI_PROJECT_DIR/frontend/openapi.json"
    - echo "OPENAPI_B64_BEGIN"
    - base64 -w 0 "$CI_PROJECT_DIR/frontend/openapi.json" | fold -w 3800
    - echo "OPENAPI_B64_END"
  artifacts:
    paths:
      - frontend/openapi.json
    expire_in: 1 day

# Frontend (frontend/)

ui:lint-build:
  stage: test
  image: node:20-slim
  needs:
    - job: api:openapi-schema
      artifacts: true
  # api/**/* is included so API-only changes still type-check the frontend
  # against the freshly exported contract: a backend schema change that
  # breaks the generated types must fail here, not at runtime.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - api/**/*
        - frontend/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
      changes:
        - api/**/*
        - frontend/**/*
        - .gitlab-ci.yml
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules
  variables:
    # Generate contract types from the schema exported by api:openapi-schema
    # instead of hand-written interfaces. Points gen:api at the artifact.
    VITE_OPENAPI_SCHEMA: "$CI_PROJECT_DIR/frontend/openapi.json"
  before_script:
    - cd frontend
    - npm ci
    - npm run gen:api
  script:
    - npm run lint
    # The root tsconfig.json is a {"files": [], "references": []} solution
    # stub that type-checks nothing; target the app project explicitly so
    # generated-schema drift fails this check, not only the build.
    - npx tsc --noEmit -p tsconfig.app.json
    - npm run build
